<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Macaque Games</title>
  <style>
    :root { color-scheme: light dark; --text: #2b2b2b; --muted: #666; --bg: #fafafa; --link: #c62828; }
    @media (prefers-color-scheme: dark) { :root { --text: #eee; --muted: #aaa; --bg: #161616; --link: #ef9a9a; } }
    body { margin: 0; padding: 48px 16px; background: var(--bg); color: var(--text);
           font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 640px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 32px; }
    h2 { margin: 40px 0 8px; font-size: 20px; }
    p { margin: 0 0 12px; color: var(--muted); }
    a { color: var(--link); }
    ul { padding-left: 20px; }
    li { margin-bottom: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>Macaque Games</h1>
    <p>Small, independent mobile games.</p>

    <h2>Games</h2>
    <ul>
      <li>
        <a href="https://play.google.com/store/apps/details?id=pl.macaque.Missiles">Missiles!</a>
        (<a href="https://sites.google.com/view/missiles-game">privacy policy</a>)
      </li>
      <li>
        <a href="https://play.google.com/store/apps/details?id=pl.macaque.FernFlower">Fern Flower</a>
        (<a href="https://sites.google.com/view/fern-flower">privacy policy</a>)
      </li>
    </ul>

    <h2>Contact</h2>
    <p><a href="mailto:macaque.games@gmail.com">macaque.games@gmail.com</a></p>
  </main>
</body>
</html>
